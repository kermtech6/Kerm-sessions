<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05060f">
<title>KERM-MD-V1 | Pair code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--bg:#05060f;--c1:#22e4ff;--c2:#8b5cff;--c3:#ff4fd8;--ok:#3dffb0;--tx:#eaf0ff;--mu:#8d9ac0;--bd:rgba(255,255,255,.09)}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:20px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--c1);outline-offset:3px}
#fx{position:fixed;inset:0;z-index:-3}
.aura{position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 10% 0,rgba(139,92,255,.28),transparent 35%),radial-gradient(circle at 95% 100%,rgba(34,228,255,.18),transparent 38%)}
.floor{position:fixed;left:-50%;right:-50%;bottom:0;height:42vh;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,rgba(34,228,255,.22) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,rgba(139,92,255,.22) 0 1px,transparent 1px 60px);background-position:0 0,0 0;transform:perspective(420px) rotateX(64deg);transform-origin:bottom;animation:flow 2.5s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 75%);mask-image:linear-gradient(transparent,#000 75%)}
@keyframes flow{to{background-position:0 0,0 60px}}
.wrap{width:100%;max-width:500px;animation:up .8s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
.neon{position:relative;border-radius:28px;background:rgba(10,13,30,.74);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:30px}
.neon::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 6s linear infinite;pointer-events:none;opacity:.75}
@keyframes rot{to{--a:360deg}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.ib{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--bd);transition:.3s}
.ib:hover{transform:translateX(-3px);color:var(--c1);box-shadow:0 0 22px rgba(34,228,255,.25)}
.st{display:flex;align-items:center;gap:9px;padding:8px 15px;border-radius:99px;background:rgba(61,255,176,.08);border:1px solid rgba(61,255,176,.2);color:var(--ok);font-size:.85rem;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{transform:scale(1.5);opacity:.6}}
.ring{position:relative;width:104px;height:104px;margin:0 auto 22px}
.ring::before{content:'';position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c1));animation:sp 4s linear infinite;filter:drop-shadow(0 0 14px rgba(139,92,255,.6))}
.ring::after{content:'';position:absolute;inset:3px;border-radius:50%;background:#0a0d1e}
@keyframes sp{to{transform:rotate(360deg)}}
.ring img{position:relative;z-index:2;width:100%;height:100%;border-radius:50%;object-fit:cover;padding:7px}
h1{text-align:center;font-size:2rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(110deg,var(--c1),#fff 50%,var(--c2));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gm 5s linear infinite}
@keyframes gm{to{background-position:250% 0}}
.sub{text-align:center;color:var(--mu);font-weight:300;margin:6px 0 26px}
.fld{position:relative;margin-bottom:14px}
.fld i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--c1);pointer-events:none}
.inp{width:100%;height:60px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);color:var(--tx);padding:0 18px 0 50px;font:500 1.05rem 'Outfit',sans-serif;outline:none;transition:.3s}
.inp::placeholder{color:#76839f}
.inp:focus{border-color:rgba(34,228,255,.45);box-shadow:0 0 0 4px rgba(34,228,255,.09),0 0 26px rgba(34,228,255,.14)}
.inp.bad{border-color:var(--c3);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{color:var(--mu);font-size:.85rem;margin:0 0 16px 4px;font-weight:300}
.go{position:relative;overflow:hidden;width:100%;height:58px;border:0;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font:600 1.02rem 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;transition:.3s;box-shadow:0 12px 34px rgba(139,92,255,.38)}
.go::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-120%);transition:.7s}
.go:hover:not(:disabled)::before{transform:translateX(120%)}
.go:hover:not(:disabled){transform:translateY(-3px)}
.go:disabled{cursor:wait;opacity:.9}
.go.load .gt{display:none}
.go.load::after{content:'';width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.chip{padding:13px 8px;border-radius:16px;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);color:var(--mu);font-size:.85rem;transition:.3s}
.chip:hover{transform:translateY(-4px);background:rgba(34,228,255,.06)}
.chip i{display:block;color:var(--c1);font-size:1.1rem;margin-bottom:6px}

.res{display:none;margin-top:24px;padding:24px 18px;border-radius:22px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.res.show{display:block;animation:up .5s cubic-bezier(.2,.7,.2,1)}
.rt{text-align:center;color:var(--mu);font-size:.95rem;margin-bottom:16px}
.cells{display:flex;justify-content:center;align-items:center;gap:6px;margin-bottom:20px}
.cell{width:clamp(28px,8.5vw,42px);height:clamp(40px,12vw,56px);display:grid;place-items:center;border-radius:12px;background:rgba(34,228,255,.07);border:1px solid rgba(34,228,255,.3);font:700 clamp(1.05rem,5vw,1.65rem) 'JetBrains Mono',monospace;color:var(--c1);text-shadow:0 0 14px var(--c1);opacity:0;transform:translateY(14px) scale(.8);animation:cell .45s cubic-bezier(.2,.8,.3,1.3) forwards}
@keyframes cell{to{opacity:1;transform:none}}
.dash{color:var(--mu);font-weight:700;padding:0 2px}
.err{text-align:center;color:var(--c3);background:rgba(255,79,216,.08);border:1px solid rgba(255,79,216,.25);border-radius:14px;padding:14px;margin-bottom:6px;font-weight:500}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.abtn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 12px;border:0;border-radius:16px;cursor:pointer;font:600 .98rem 'Outfit',sans-serif;line-height:1;transition:.3s;white-space:nowrap}
.abtn i{font-size:1rem}
.abtn:hover{transform:translateY(-3px)}
.copy{background:linear-gradient(135deg,var(--ok),#00c98a);color:#04150e;box-shadow:0 10px 28px rgba(61,255,176,.25)}
.copy.ok{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.home{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff}
.home:hover{background:rgba(255,255,255,.1)}
.how{margin-top:16px;text-align:center;color:var(--mu);font-size:.85rem;font-weight:300}
.foot{margin-top:22px;text-align:center;color:var(--mu);font-size:.88rem}
.soc{display:flex;justify-content:center;gap:12px;margin-top:12px}
.soc a{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--bd);transition:.3s}
.soc a:hover{transform:translateY(-4px);color:var(--c1);background:rgba(34,228,255,.08)}
@media(max-width:480px){.neon{padding:24px 18px}h1{font-size:1.6rem}.chips{grid-template-columns:1fr}.acts{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cell{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="aura"></div>
<div class="floor"></div>

<div class="wrap">
  <main class="neon">
    <div class="top">
      <a href="./" class="ib" aria-label="Back to home"><i class="fas fa-arrow-left"></i></a>
      <div class="st"><i class="dot"></i>Online</div>
    </div>

    <div class="ring"><img src="https://raw.githubusercontent.com/kermtech6/logo/refs/heads/main/56C67450-A2D2-468E-B0CB-A76D4D48AE37.png" alt="KERM-MD logo"></div>
    <h1>KERM-MD Pair</h1>
    <p class="sub">Enter your WhatsApp number to get your pairing code.</p>

    <div class="fld">
      <i class="fas fa-phone"></i>
      <input class="inp" id="num" type="tel" inputmode="numeric" autocomplete="off" placeholder="237xxxxxxxx" aria-label="WhatsApp number with country code">
    </div>
    <p class="hint">Country code first, digits only. No + or spaces.</p>
    <button class="go" id="go"><span class="gt"><i class="fas fa-bolt"></i>&nbsp; Generate code</span></button>

    <div class="chips">
      <div class="chip"><i class="fas fa-shield-halved"></i>Encrypted</div>
      <div class="chip"><i class="fas fa-bolt"></i>Fast pairing</div>
      <div class="chip"><i class="fas fa-server"></i>Stable</div>
    </div>

    <section class="res" id="res" aria-live="polite">
      <div class="rt" id="rt">Your pairing code</div>
      <div class="cells" id="cells"></div>
      <div class="err" id="err" hidden></div>
      <div class="acts" id="acts">
        <button class="abtn copy" id="copy" type="button"><i class="fas fa-copy" id="ci"></i><span id="ct">Copy code</span></button>
        <a class="abtn home" href="./"><i class="fas fa-house"></i><span>Home</span></a>
      </div>
      <p class="how" id="how">WhatsApp → Linked devices → Link with phone number → enter the code</p>
    </section>
  </main>

  <div class="foot">
    <p>© <span id="yr"></span> Kerm Tech</p>
    <div class="soc">
      <a href="https://github.com/kermtech6/KERM-MD-V1" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
      <a href="https://t.me/lord_kerm" target="_blank" rel="noopener" aria-label="Telegram"><i class="fab fa-telegram"></i></a>
      <a href="https://whatsapp.com/channel/0029VbCgEqc0bIdmRMLots12" target="_blank" rel="noopener" aria-label="WhatsApp channel"><i class="fab fa-whatsapp"></i></a>
    </div>
  </div>
</div>

<script>
/* background network */
(()=>{const c=document.getElementById('fx'),x=c.getContext('2d');let w,h,p=[];
const R=()=>{w=c.width=innerWidth;h=c.height=innerHeight;p=Array.from({length:Math.min(70,w*h/16000|0)},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.45}))};
R();addEventListener('resize',R);
(function L(){x.clearRect(0,0,w,h);
p.forEach((a,i)=>{a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h;x.fillStyle='rgba(34,228,255,.85)';x.fillRect(a.x,a.y,2,2);
for(let j=i+1;j<p.length;j++){const b=p[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.strokeStyle='rgba(139,92,255,'+(1-d/130)*.35+')';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}});
requestAnimationFrame(L)})()})();

const $=id=>document.getElementById(id);
const inp=$('num'),go=$('go'),res=$('res'),cells=$('cells'),err=$('err'),copy=$('copy'),ct=$('ct'),ci=$('ci'),acts=$('acts'),how=$('how'),rt=$('rt');
let code='';
$('yr').textContent=new Date().getFullYear();

inp.addEventListener('input',()=>{inp.value=inp.value.replace(/\D/g,'')});
inp.addEventListener('keydown',e=>{if(e.key==='Enter')go.click()});

function showErr(msg){
  cells.innerHTML='';err.textContent=msg;err.hidden=false;
  how.hidden=true;copy.hidden=true;acts.style.gridTemplateColumns='1fr';rt.textContent='Something went wrong';
  res.classList.add('show');
}
function showCode(raw){
  const c=raw.replace(/-/g,'').toUpperCase();
  code=c.length===8?c.slice(0,4)+'-'+c.slice(4):c;
  err.hidden=true;how.hidden=false;copy.hidden=false;acts.style.gridTemplateColumns='';rt.textContent='Your pairing code';
  cells.innerHTML='';
  [...code].forEach((ch,i)=>{
    const s=document.createElement('span');
    s.className=ch==='-'?'dash':'cell';s.textContent=ch;
    if(ch!=='-')s.style.animationDelay=(i*70)+'ms';
    cells.appendChild(s);
  });
  res.classList.remove('show');void res.offsetWidth;res.classList.add('show');
  res.scrollIntoView({behavior:'smooth',block:'nearest'});
}

go.addEventListener('click',async()=>{
  const n=inp.value.trim();
  if(n.length<10){inp.classList.add('bad');setTimeout(()=>inp.classList.remove('bad'),1200);inp.focus();return}
  go.disabled=true;go.classList.add('load');
  try{
    const r=await fetch('/code?number='+encodeURIComponent(n));
    const d=await r.json();
    /^[A-Za-z0-9-]{8,9}$/.test(d.code||'')?showCode(d.code):showErr(d.code||'Service unavailable. Try again in a moment.');
  }catch(e){showErr('Network error. Check your connection and try again.')}
  go.disabled=false;go.classList.remove('load');
});

copy.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(code)}
  catch{const t=document.createElement('textarea');t.value=code;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch{}t.remove()}
  ct.textContent='Copied';ci.className='fas fa-check';copy.classList.add('ok');
  setTimeout(()=>{ct.textContent='Copy code';ci.className='fas fa-copy';copy.classList.remove('ok')},2000);
});
</script>
</body>
</html>
